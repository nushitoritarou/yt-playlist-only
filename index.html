<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Playlist</title>
<style>
  html, body { margin: 0; height: 100%; font-family: sans-serif; background: #000; }
  iframe { width: 100%; height: 100%; border: 0; display: block; }
  #setup { padding: 16px; background: #fff; }
  #setup input { width: 100%; box-sizing: border-box; font-size: 16px; padding: 8px; margin: 8px 0; }
</style>
</head>
<body>
<form id="setup" hidden>
  <p>再生リストID（PLから始まる文字列）または再生リストのURL</p>
  <input id="pl" placeholder="PLxxxxxxxx" autocomplete="off" autocapitalize="off" spellcheck="false">
  <button>保存</button>
</form>
<script>
  const get = () => { try { return localStorage.getItem("pl"); } catch { return null; } };
  const set = v => { try { localStorage.setItem("pl", v); } catch {} };

  // URL(…?list=PLxxx)が貼られた場合は list パラメータを取り出す
  function parse(v) {
    try { return new URL(v).searchParams.get("list") || v; } catch { return v; }
  }

  function show(id) {
    document.getElementById("setup").hidden = true;
    const f = document.createElement("iframe");
    f.src = "https://www.youtube-nocookie.com/embed/videoseries?list=" + encodeURIComponent(id)
      + "&playsinline=1"; // iOSで全画面に強制遷移させず、プレイヤー内のUI(再生リスト一覧など)を使えるようにする
    f.allow = "fullscreen; encrypted-media; picture-in-picture";
    f.allowFullscreen = true;
    f.referrerPolicy = "strict-origin-when-cross-origin";
    document.body.appendChild(f);
  }

  const saved = get();
  if (saved) show(saved);
  else {
    const form = document.getElementById("setup");
    form.hidden = false;
    form.onsubmit = e => {
      e.preventDefault();
      const v = parse(document.getElementById("pl").value.trim());
      if (v) { set(v); show(v); }
    };
  }
</script>
</body>
</html>
