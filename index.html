<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Playlist</title>
<style>
  html, body { margin: 0; height: 100%; font-family: sans-serif; background: #000; }
  iframe { width: 100%; height: 100%; border: 0; display: block; }
  #setup { padding: 16px; background: #fff; }
  #setup input { width: 100%; box-sizing: border-box; font-size: 16px; padding: 8px; margin: 8px 0; }
  #history { list-style: none; padding: 0; }
  #history button { width: 100%; text-align: left; font-size: 16px; padding: 12px 8px; margin: 4px 0; }
</style>
</head>
<body>
<form id="setup" hidden>
  <p>再生リストID（PLから始まる文字列）または再生リストのURL</p>
  <input id="pl" placeholder="PLxxxxxxxx" autocomplete="off" autocapitalize="off" spellcheck="false">
  <button>開く</button>
  <ul id="history"></ul>
</form>
<script>
  // 入力したことのある再生リストIDを新しい順に保存する
  const KEY = "playlists";
  function load() {
    try {
      const a = JSON.parse(localStorage.getItem(KEY));
      if (Array.isArray(a)) return a;
      const old = localStorage.getItem("pl"); // 旧版は1件だけ "pl" に保存していた
      return old ? [old] : [];
    } catch { return []; }
  }
  function remember(id) {
    const a = [id, ...load().filter(x => x !== id)];
    try { localStorage.setItem(KEY, JSON.stringify(a)); } catch {}
  }

  // URL(…?list=PLxxx)が貼られた場合は list パラメータを取り出す
  function parse(v) {
    try { return new URL(v).searchParams.get("list") || v; } catch { return v; }
  }

  function show(id) {
    remember(id);
    document.getElementById("setup").hidden = true;
    const f = document.createElement("iframe");
    f.src = "https://www.youtube-nocookie.com/embed/videoseries?list=" + encodeURIComponent(id)
      + "&playsinline=1"; // iOSで全画面に強制遷移させず、プレイヤー内のUI(再生リスト一覧など)を使えるようにする
    f.allow = "fullscreen; encrypted-media; picture-in-picture";
    f.allowFullscreen = true;
    f.referrerPolicy = "strict-origin-when-cross-origin";
    document.body.appendChild(f);
  }

  // リロード時は常に入力画面から始め、履歴から選べるようにする
  const form = document.getElementById("setup");
  const list = document.getElementById("history");
  for (const id of load()) {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = id;
    b.onclick = () => show(id);
    li.appendChild(b);
    list.appendChild(li);
  }
  form.hidden = false;
  form.onsubmit = e => {
    e.preventDefault();
    const v = parse(document.getElementById("pl").value.trim());
    if (v) show(v);
  };
</script>
</body>
</html>
