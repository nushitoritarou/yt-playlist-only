<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Playlist</title>
<style>
  body { margin: 0; font-family: sans-serif; }
  #bar { height: 48px; box-sizing: border-box; padding: 4px 8px; }
  #bar button { height: 40px; font-size: 16px; }
  /* 16:9。横長の画面でも上部バーと合わせて画面の高さに収める */
  iframe { display: block; width: min(100%, calc((100dvh - 48px) * 16 / 9)); aspect-ratio: 16 / 9; margin: 0 auto; border: 0; }
  #setup { padding: 16px; }
  #setup input { width: 100%; box-sizing: border-box; font-size: 16px; padding: 8px; margin: 8px 0; }
  #history { list-style: none; padding: 0; }
  #history small { color: #666; }
  #history button { width: 100%; text-align: left; font-size: 16px; padding: 12px 8px; margin: 4px 0; }
</style>
</head>
<body>
<form id="setup" hidden>
  <p>再生リストID（PLから始まる文字列）または再生リストのURL</p>
  <input id="pl" placeholder="PLxxxxxxxx" autocomplete="off" autocapitalize="off" spellcheck="false">
  <button>開く</button>
  <ul id="history"></ul>
</form>
<div id="player" hidden>
  <div id="bar"><button id="back" type="button">← 履歴</button></div>
</div>
<script>
  // 入力したことのある再生リストを {id, title} の配列で新しい順に保存する
  const KEY = "playlists";
  function load() {
    try {
      const a = JSON.parse(localStorage.getItem(KEY));
      // 旧形式(IDの文字列の配列)と旧版の "pl" キー(1件のみ)を引き継ぐ
      if (Array.isArray(a)) return a.map(x => typeof x === "string" ? { id: x } : x);
      const old = localStorage.getItem("pl");
      return old ? [{ id: old }] : [];
    } catch { return []; }
  }
  function save(a) {
    try { localStorage.setItem(KEY, JSON.stringify(a)); } catch {}
  }
  function remember(id) {
    const a = load();
    const cur = a.find(x => x.id === id) || { id };
    save([cur, ...a.filter(x => x.id !== id)]);
  }

  // oEmbedで再生リスト名を取得して履歴に記録する。失敗しても再生には影響させない
  async function fetchTitle(id) {
    try {
      const u = "https://www.youtube.com/playlist?list=" + encodeURIComponent(id);
      const r = await fetch("https://www.youtube.com/oembed?format=json&url=" + encodeURIComponent(u));
      if (!r.ok) return;
      const { title } = await r.json();
      if (!title) return;
      save(load().map(x => x.id === id ? { id, title } : x));
    } catch {}
  }

  // URL(…?list=PLxxx)が貼られた場合は list パラメータを取り出す
  function parse(v) {
    try { return new URL(v).searchParams.get("list") || v; } catch { return v; }
  }

  function show(id) {
    remember(id);
    fetchTitle(id);
    form.hidden = true;
    player.hidden = false;
    const f = document.createElement("iframe");
    f.src = "https://www.youtube-nocookie.com/embed/videoseries?list=" + encodeURIComponent(id)
      + "&playsinline=1"; // iOSで全画面に強制遷移させず、プレイヤー内のUI(再生リスト一覧など)を使えるようにする
    f.allow = "fullscreen; encrypted-media; picture-in-picture";
    f.allowFullscreen = true;
    f.referrerPolicy = "strict-origin-when-cross-origin";
    player.appendChild(f);
  }

  // 入力画面と履歴を表示する。リロード時もプレイヤーから戻ったときもここから始める
  const form = document.getElementById("setup");
  const list = document.getElementById("history");
  const player = document.getElementById("player");
  function showSetup() {
    player.querySelector("iframe")?.remove(); // iframeごと消して再生を止める
    player.hidden = true;
    list.replaceChildren();
    for (const { id, title } of load()) {
      const li = document.createElement("li");
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = title || id;
      if (title) {
        const small = document.createElement("small");
        small.textContent = id;
        b.append(document.createElement("br"), small);
      }
      b.onclick = () => show(id);
      li.appendChild(b);
      list.appendChild(li);
    }
    form.hidden = false;
  }
  document.getElementById("back").onclick = showSetup;
  showSetup();
  form.onsubmit = e => {
    e.preventDefault();
    const v = parse(document.getElementById("pl").value.trim());
    if (v) show(v);
  };
</script>
</body>
</html>
